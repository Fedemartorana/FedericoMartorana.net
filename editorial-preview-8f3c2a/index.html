<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ATLANTE — Editorial Prototype</title>
<style>
:root{--paper:#f2efe7;--ink:#151512;--muted:#77736a;--line:#c9c3b7;--accent:#b84c32;--rail:360px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:var(--rail) 1fr}.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--paper);z-index:3}.brand{padding:20px 22px 18px;border-bottom:1px solid var(--line)}.brand-top{display:flex;justify-content:space-between;gap:20px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.brand h1{font-size:44px;line-height:.92;margin:44px 0 10px;letter-spacing:-.045em}.brand p{font-size:13px;line-height:1.35;margin:0;max-width:260px}.tracklist{overflow:auto;flex:1}.track{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 18px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;text-align:left;cursor:pointer;transition:background .15s}.track:hover,.track.active{background:var(--ink);color:var(--paper)}.track .num,.track .time{font-size:11px;letter-spacing:.08em}.track .title{font-size:15px;line-height:1.12}.track .author{font-size:11px;margin-top:4px;opacity:.68;text-transform:uppercase}.rail-footer{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.06em}.reader{min-width:0;position:relative}.reader-head{position:sticky;top:0;z-index:2;background:rgba(242,239,231,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 26px 10px}.reader-meta{display:flex;justify-content:space-between;gap:20px;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.progress{height:2px;background:var(--line);margin-top:10px;position:relative;overflow:hidden}.progress span{display:block;height:100%;width:0;background:var(--accent)}.article{max-width:1060px;margin:0 auto;padding:54px 54px 120px}.article-kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}.article h2{font-size:clamp(52px,7.8vw,116px);line-height:.84;letter-spacing:-.065em;margin:0 0 24px;max-width:950px;font-weight:700}.dek{font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:1.2;max-width:760px;margin:0 0 54px}.record{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin-bottom:62px}.cell{padding:12px 10px 14px;border-right:1px solid var(--line)}.cell:last-child{border-right:0}.label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}.value{font-size:13px;line-height:1.25}.body{font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:1.42;max-width:760px;margin-left:auto}.body p{margin:0 0 1.15em}.body p:first-child:first-letter{float:left;font-family:Arial,Helvetica,sans-serif;font-size:84px;line-height:.75;padding:11px 10px 0 0}.pull{font-family:Arial,Helvetica,sans-serif;font-size:38px;line-height:1.02;letter-spacing:-.035em;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:18px 0 22px;margin:54px 0}.next{margin-top:80px;border-top:1px solid var(--ink);padding-top:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}.next button{border:0;background:none;padding:0;text-align:left;cursor:pointer}.next small{display:block;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.next strong{font-size:28px;line-height:1}.mobile-index{display:none}
@media(max-width:820px){:root{--rail:100%}.shell{display:block}.rail{position:relative;height:auto;border-right:0}.brand h1{font-size:58px;margin-top:36px}.tracklist{max-height:none}.reader{display:none}.shell.reading .rail{display:none}.shell.reading .reader{display:block}.mobile-index{display:inline;border:0;background:none;padding:0;text-transform:uppercase;letter-spacing:.08em}.reader-head{padding:12px 16px}.article{padding:36px 18px 90px}.article h2{font-size:52px}.dek{font-size:21px}.record{grid-template-columns:1fr 1fr}.cell:nth-child(2){border-right:0}.cell:nth-child(-n+2){border-bottom:1px solid var(--line)}.body{font-size:19px}.pull{font-size:30px}}
</style>
</head>
<body>
<div class="shell" id="shell">
<aside class="rail">
  <div class="brand">
    <div class="brand-top"><span>ASAP / ISSUE 01</span><span>2026</span></div>
    <h1>ATLANTE<br>DI DOMANDE</h1>
    <p>Una raccolta di posizioni, dialoghi e ipotesi sull’architettura contemporanea.</p>
  </div>
  <div class="tracklist" id="tracklist"></div>
  <div class="rail-footer"><span>Politecnico di Milano</span><span>05 tracce</span></div>
</aside>
<main class="reader" id="reader">
  <header class="reader-head">
    <div class="reader-meta"><button class="mobile-index" id="back">← Indice</button><span id="now">01 / 05</span><span id="elapsed">00:00 / 04:10</span></div>
    <div class="progress"><span id="bar"></span></div>
  </header>
  <article class="article" id="article"></article>
</main>
</div>
<script>
const articles=[
{n:'01',title:'Oltre il mercato',author:'Nicola Russi',type:'Argomentazione',time:'04:10',theme:'Didattica / mercato',question:'Può l’insegnamento costruire una cultura del progetto alternativa, dentro e fuori dal mercato?',body:[`L’università non dovrebbe limitarsi a preparare figure perfettamente compatibili con il sistema produttivo esistente. Il suo spazio più fertile nasce precisamente dove il mercato smette di essere una risposta sufficiente.`, `Esistono programmi, bisogni e forme di vita che non attraggono investimenti, ma non per questo sono meno reali. Portarli dentro il progetto non significa fuggire dalla realtà: significa allargarne il campo e costruire strumenti per ciò che oggi appare improbabile.`, `La scuola può allora agire come luogo di sospensione critica. Non una torre d’avorio, ma un laboratorio nel quale il verosimile precede il possibile e dove lo studente impara a formulare domande prima ancora di produrre soluzioni.`],pull:'Parlare di ciò che ha scarse possibilità di accadere non significa fuggire dal mondo.'},
{n:'02',title:'Maestri…?',author:'Associates Architecture',type:'Dialogo',time:'03:35',theme:'Eredità / distacco',question:'È ancora possibile avere modelli di riferimento o è necessario un distacco netto per operare nel contemporaneo?',body:[`Il rapporto con i maestri resta un paradosso necessario. Ogni generazione eredita un lessico, una disciplina e una serie di immagini che rendono possibile il proprio lavoro, ma che possono anche trasformarsi in un peso.`, `Uccidere i maestri non significa cancellarli. Significa sottrarli alla ripetizione automatica, rifiutare il riflesso dell’emulazione e tornare a interrogarli da una posizione autonoma.`, `Il distacco diventa produttivo quando permette di leggere il presente senza rinunciare alla profondità storica. La tradizione smette così di essere una forma da riprodurre e torna a essere un conflitto aperto.`],pull:'Prima la fatica di studiarlo, poi la fatica di rifiutarlo per poterlo superare.'},
{n:'03',title:'Otium / Negotium',author:'Andrea Ponsi + Raffaele Bueno',type:'Doppia voce',time:'05:20',theme:'Lentezza / osservazione',question:'La lentezza è una necessità personale, una forma di resistenza o uno strumento di conoscenza?',body:[`La contemplazione occupa oggi uno spazio minuscolo. Il progetto è scandito da consegne, revisioni, immagini e risposte immediate; fermarsi appare quasi come una colpa.`, `Eppure osservare è una pratica operativa. Le idee hanno bisogno di sedimentare, così come i luoghi richiedono tempo per essere compresi oltre la loro superficie. La lentezza non è nostalgia: è precisione.`, `Disegnare, viaggiare senza uno scopo immediato, guardare fuori dalla finestra o tornare più volte sullo stesso dettaglio sono modi per sottrarre il progetto alla reazione istantanea e restituirgli profondità.`],pull:'Ogni lavoro che aspiri alla qualità ha bisogno di tempo per maturare.'},
{n:'04',title:'Imparare a disimparare',author:'Zarcola / Errante / Oasi',type:'Conversazione',time:'04:45',theme:'Cantiere / errore',question:'Quanto il processo di autocritica continua nella fase di costruzione?',body:[`Il cantiere non è la traduzione passiva di un disegno già concluso. È il luogo in cui il progetto incontra la materia, il lavoro, il costo e l’imprevisto.`, `L’errore obbliga a disimparare. Costringe il dettaglio a uscire dalla sua perfezione astratta e a diventare negoziazione, invenzione e misura reale.`, `Quando l’architetto segue direttamente la costruzione, la distanza fra mente e mano si riduce. L’opera diventa una maquette in scala uno a uno, capace di modificare chi la sta producendo.`],pull:'La costruzione diventa un’estensione diretta della mente e delle mani.'},
{n:'05',title:'Nomadismo formativo',author:'Filippo Bricolo + Roberto Bosi',type:'Intervista',time:'03:50',theme:'Radici / erranza',question:'È possibile essere nomadi e stanziali contemporaneamente?',body:[`Partire permette di riconoscere ciò che a casa era diventato invisibile. Il confronto con altri luoghi, tecniche e culture non cancella le radici: le rende leggibili.`, `Il nomadismo formativo è un dispositivo critico. Produce distanza dalle abitudini e consente di tornare con un lessico più ampio, senza trasformare il territorio in un repertorio folklorico.`, `Conoscere il mondo senza conoscere il luogo genera un’architettura astratta. Conoscere solo il luogo produce invece chiusura. Il progetto nasce dalla tensione fra queste due forme di appartenenza.`],pull:'L’architettura di un luogo senza la conoscenza del mondo è sbagliata quanto il contrario.'}
];
const list=document.getElementById('tracklist'),article=document.getElementById('article'),bar=document.getElementById('bar'),now=document.getElementById('now'),elapsed=document.getElementById('elapsed'),shell=document.getElementById('shell');let current=0;
articles.forEach((a,i)=>{const b=document.createElement('button');b.className='track';b.innerHTML=`<span class="num">${a.n}</span><span><span class="title">${a.title}</span><span class="author">${a.author}</span></span><span class="time">${a.time}</span>`;b.onclick=()=>openArticle(i);list.appendChild(b)});
function openArticle(i){current=i;document.querySelectorAll('.track').forEach((x,j)=>x.classList.toggle('active',j===i));const a=articles[i];article.innerHTML=`<div class="article-kicker">Traccia ${a.n} — ${a.theme}</div><h2>${a.title}</h2><p class="dek">${a.question}</p><section class="record"><div class="cell"><span class="label">Autore</span><span class="value">${a.author}</span></div><div class="cell"><span class="label">Formato</span><span class="value">${a.type}</span></div><div class="cell"><span class="label">Tema</span><span class="value">${a.theme}</span></div><div class="cell"><span class="label">Tempo</span><span class="value">${a.time}</span></div></section><div class="body">${a.body.map((p,k)=>`${k===1?`<blockquote class="pull">${a.pull}</blockquote>`:''}<p>${p}</p>`).join('')}<div class="next"><div><small>Traccia successiva</small><button id="next"><strong>${articles[(i+1)%articles.length].n} — ${articles[(i+1)%articles.length].title}</strong></button></div><span>→</span></div></div>`;now.textContent=`${a.n} / 05`;elapsed.textContent=`00:00 / ${a.time}`;document.getElementById('next').onclick=()=>openArticle((i+1)%articles.length);shell.classList.add('reading');window.scrollTo(0,0);updateProgress()}
function updateProgress(){const max=document.documentElement.scrollHeight-innerHeight;const p=max>0?scrollY/max:0;bar.style.width=`${Math.min(100,p*100)}%`;const total=articles[current].time.split(':').reduce((m,s)=>m*60+Number(s));const sec=Math.floor(total*p);elapsed.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')} / ${articles[current].time}`}
addEventListener('scroll',updateProgress,{passive:true});document.getElementById('back').onclick=()=>shell.classList.remove('reading');openArticle(0);if(innerWidth<=820)shell.classList.remove('reading');
</script>
</body>
</html>
