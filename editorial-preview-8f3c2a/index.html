<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ATLANTE — Editorial Prototype</title>
<style>
:root{--paper:#faf9f5;--ink:#080808;--muted:#6f6e69;--line:#c9c8c2;--accent:#ff3d00;--rail:360px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:var(--rail) 1fr}.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--paper);z-index:3}.brand{padding:20px 22px 18px;border-bottom:1px solid var(--line)}.brand-top{display:flex;justify-content:space-between;gap:20px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.brand h1{font-size:44px;line-height:.92;margin:44px 0 10px;letter-spacing:-.045em}.brand p{font-size:13px;line-height:1.35;margin:0;max-width:260px}.tracklist{overflow:auto;flex:1}.track{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 18px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;text-align:left;cursor:pointer;transition:background .15s}.track:hover,.track.active{background:var(--ink);color:var(--paper)}.track .num,.track .time{font-size:11px;letter-spacing:.08em}.track .title{font-size:15px;line-height:1.12}.track .author{font-size:11px;margin-top:4px;opacity:.68;text-transform:uppercase}.reader{min-width:0;position:relative}.reader-head{position:sticky;top:0;z-index:2;background:rgba(250,249,245,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 26px 10px}.reader-meta{display:flex;justify-content:space-between;gap:20px;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.progress{height:7px;background:var(--line);margin-top:10px;position:relative;overflow:hidden}.progress span{display:block;height:100%;width:0;background:var(--accent)}.article{max-width:1060px;margin:0 auto;padding:54px 54px 120px}.article-kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}.article h2{font-size:clamp(52px,7.8vw,116px);line-height:.84;letter-spacing:-.065em;margin:0 0 24px;max-width:950px;font-weight:700}.dek{font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:1.2;max-width:760px;margin:0 0 54px}.record{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin-bottom:62px}.cell{padding:12px 10px 14px;border-right:1px solid var(--line)}.cell:last-child{border-right:0}.label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}.value{font-size:13px;line-height:1.25}.image-placeholder{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--ink);background:#efeee9;margin:0 0 62px}.image-placeholder::before,.image-placeholder::after{content:"";position:absolute;background:var(--line)}.image-placeholder::before{width:1px;height:100%;left:50%;top:0;transform:rotate(29deg)}.image-placeholder::after{height:1px;width:100%;left:0;top:50%;transform:rotate(29deg)}.image-label{position:absolute;left:10px;bottom:9px;font:10px Arial,Helvetica,sans-serif;letter-spacing:.1em;text-transform:uppercase;background:var(--paper);padding:4px 6px}.body{font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:1.42;max-width:760px;margin-left:auto}.body p{margin:0 0 1.15em}.body p:first-child:first-letter{float:left;font-family:Arial,Helvetica,sans-serif;font-size:84px;line-height:.75;padding:11px 10px 0 0}.body .image-placeholder{aspect-ratio:4/3;margin:46px 0}.pull{font-family:Arial,Helvetica,sans-serif;font-size:38px;line-height:1.02;letter-spacing:-.035em;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:18px 0 22px;margin:54px 0}.next{margin-top:80px;border-top:1px solid var(--ink);padding-top:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}.next button{border:0;background:none;padding:0;text-align:left;cursor:pointer}.next small{display:block;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.next strong{font-size:28px;line-height:1}.mobile-index{display:none}
@media(max-width:820px){:root{--rail:100%}.shell{display:block}.rail{position:relative;height:auto;border-right:0}.brand h1{font-size:58px;margin-top:36px}.tracklist{max-height:none}.reader{display:none}.shell.reading .rail{display:none}.shell.reading .reader{display:block}.mobile-index{display:inline;border:0;background:none;padding:0;text-transform:uppercase;letter-spacing:.08em}.reader-head{padding:12px 16px}.article{padding:36px 18px 90px}.article h2{font-size:52px}.dek{font-size:21px}.record{grid-template-columns:1fr 1fr}.cell:nth-child(2){border-right:0}.cell:nth-child(-n+2){border-bottom:1px solid var(--line)}.body{font-size:19px}.pull{font-size:30px}}
</style>
</head>
<body>
<div class="shell" id="shell">
<aside class="rail">
  <div class="brand">
    <div class="brand-top"><span>ASAP / ISSUE 01</span><span>2026</span></div>
    <h1>ATLANTE<br>DI DOMANDE</h1>
    <p>Una raccolta di posizioni, dialoghi e ipotesi sull’architettura contemporanea.</p>
  </div>
  <div class="tracklist" id="tracklist"></div>
</aside>
<main class="reader" id="reader">
  <header class="reader-head">
    <div class="reader-meta"><button class="mobile-index" id="back">← Indice</button><span id="now">01 / 05</span><span id="elapsed">00:00 / 04:10</span></div>
    <div class="progress"><span id="bar"></span></div>
  </header>
  <article class="article" id="article"></article>
</main>
</div>
<script>
const lorem=[
`Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.`,
`Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.`,
`Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium. Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit.`
];
const articles=[
{n:'01',title:'Titolo articolo',author:'Nome autore',type:'Formato',time:'04:10',theme:'Tema',question:'Domanda di partenza o sottotitolo dell’articolo.',body:lorem,pull:'Citazione o passaggio in evidenza.'},
{n:'02',title:'Titolo articolo',author:'Nome autore',type:'Formato',time:'03:35',theme:'Tema',question:'Domanda di partenza o sottotitolo dell’articolo.',body:lorem,pull:'Citazione o passaggio in evidenza.'},
{n:'03',title:'Titolo articolo',author:'Nome autore',type:'Formato',time:'05:20',theme:'Tema',question:'Domanda di partenza o sottotitolo dell’articolo.',body:lorem,pull:'Citazione o passaggio in evidenza.'},
{n:'04',title:'Titolo articolo',author:'Nome autore',type:'Formato',time:'04:45',theme:'Tema',question:'Domanda di partenza o sottotitolo dell’articolo.',body:lorem,pull:'Citazione o passaggio in evidenza.'},
{n:'05',title:'Titolo articolo',author:'Nome autore',type:'Formato',time:'03:50',theme:'Tema',question:'Domanda di partenza o sottotitolo dell’articolo.',body:lorem,pull:'Citazione o passaggio in evidenza.'}
];
const list=document.getElementById('tracklist'),article=document.getElementById('article'),bar=document.getElementById('bar'),now=document.getElementById('now'),elapsed=document.getElementById('elapsed'),shell=document.getElementById('shell');let current=0;
articles.forEach((a,i)=>{const b=document.createElement('button');b.className='track';b.innerHTML=`<span class="num">${a.n}</span><span><span class="title">${a.title}</span><span class="author">${a.author}</span></span><span class="time">${a.time}</span>`;b.onclick=()=>openArticle(i);list.appendChild(b)});
function imagePlaceholder(label){return `<figure class="image-placeholder" role="img" aria-label="${label}"><figcaption class="image-label">${label}</figcaption></figure>`}
function openArticle(i){current=i;document.querySelectorAll('.track').forEach((x,j)=>x.classList.toggle('active',j===i));const a=articles[i];article.innerHTML=`<div class="article-kicker">Traccia ${a.n} — ${a.theme}</div><h2>${a.title}</h2><p class="dek">${a.question}</p><section class="record"><div class="cell"><span class="label">Autore</span><span class="value">${a.author}</span></div><div class="cell"><span class="label">Formato</span><span class="value">${a.type}</span></div><div class="cell"><span class="label">Tema</span><span class="value">${a.theme}</span></div><div class="cell"><span class="label">Tempo</span><span class="value">${a.time}</span></div></section>${imagePlaceholder('Immagine / 01')}<div class="body">${a.body.map((p,k)=>`${k===1?`<blockquote class="pull">${a.pull}</blockquote>`:''}<p>${p}</p>${k===1?imagePlaceholder('Immagine / 02'):''}`).join('')}<div class="next"><div><small>Traccia successiva</small><button id="next"><strong>${articles[(i+1)%articles.length].n} — ${articles[(i+1)%articles.length].title}</strong></button></div><span>→</span></div></div>`;now.textContent=`${a.n} / 05`;elapsed.textContent=`00:00 / ${a.time}`;document.getElementById('next').onclick=()=>openArticle((i+1)%articles.length);shell.classList.add('reading');window.scrollTo(0,0);updateProgress()}
function updateProgress(){const max=document.documentElement.scrollHeight-innerHeight;const p=max>0?scrollY/max:0;bar.style.width=`${Math.min(100,p*100)}%`;const total=articles[current].time.split(':').reduce((m,s)=>m*60+Number(s));const sec=Math.floor(total*p);elapsed.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')} / ${articles[current].time}`}
addEventListener('scroll',updateProgress,{passive:true});document.getElementById('back').onclick=()=>shell.classList.remove('reading');openArticle(0);if(innerWidth<=820)shell.classList.remove('reading');
</script>
</body>
</html>
